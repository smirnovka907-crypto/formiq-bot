/* Mobile Safari/Telegram preview: swipe the document and keep navigation stable. */
html,body{height:auto;min-height:100%;overscroll-behavior-y:auto}
.app{height:auto;min-height:100dvh;overflow-y:visible;touch-action:pan-y}
.view{padding-bottom:calc(138px + env(safe-area-inset-bottom))}
.view.no-bottom{padding-bottom:calc(138px + env(safe-area-inset-bottom))}
.bottom-nav{touch-action:manipulation}
input,select,textarea{max-width:100%}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

/* Approved v4: calm silver date ranges instead of numbered week tabs */
.week-selector{display:grid;grid-template-columns:1fr;gap:9px;margin:5px 0 18px}
.week-selector button{height:auto;min-height:66px;width:100%;padding:12px 15px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:15px;background:rgba(255,255,255,.28);border:1px solid rgba(101,113,117,.22);box-shadow:none}
.week-selector button.on{background:linear-gradient(130deg,#e5ebe9,#d5ddda);border-color:#8c9b98;box-shadow:inset 0 1px 3px rgba(64,75,72,.12)}
.week-range{display:block;color:#293537;font-size:17px;line-height:1.25;font-weight:765;letter-spacing:-.2px}
.week-meta{display:block;margin-top:5px;color:#616e70;font-size:12px;font-weight:570}
.week-chevron{color:#617173;font-size:22px;font-weight:450;min-width:16px}
.plan-entry:disabled{opacity:1;cursor:pointer}
.history-detail{font-size:14px;line-height:1.5;color:#536164}
.connection-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.connection-row:last-child{border-bottom:0;padding-bottom:0}
.connection-title{font-weight:750;font-size:16px}
.connection-hint{font-size:13px;color:#607072;margin-top:5px}
.connection-status{font-size:12px;color:#5c696a;border:1px solid #c2ccca;border-radius:99px;padding:6px 9px;white-space:nowrap}
.home-equipment-panel{margin-top:13px;padding:16px;border:1px solid rgba(101,113,117,.20);border-radius:16px;background:rgba(255,255,255,.24)}
.home-equipment-panel textarea{display:block;width:100%;min-height:102px;margin-top:9px}
.home-equipment-panel .input-note{font-size:13px;line-height:1.45;margin:10px 0 0}

/* Approved final plan: period and training days are separate matching silver buttons. */
.week-selector{display:flex;flex-direction:column;gap:10px}
.week-group{display:flex;flex-direction:column;gap:9px;border:0;background:transparent}
.week-group > button{width:100%;min-height:68px;padding:12px 15px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid rgba(101,113,117,.20)!important;border-radius:16px!important;background:rgba(255,255,255,.19)!important;box-shadow:none!important}
.week-group > button.on{background:linear-gradient(125deg,rgba(221,228,225,.78),rgba(245,248,247,.75))!important;border-color:#8c9b98!important}
.week-details{padding:0 0 0 10px;border:0;background:transparent}
.week-details .plan-list{display:grid;gap:9px;margin:0}
.week-details .plan-entry{width:100%;min-height:68px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;border:1px solid rgba(101,113,117,.20);border-radius:16px;background:rgba(255,255,255,.28);box-shadow:none}
.week-details .plan-entry strong{display:block;color:#293537;font-size:17px;line-height:1.25;font-weight:765}
.week-details .plan-entry small{display:block;margin-top:5px;color:#616e70;font-size:14px;line-height:1.35;font-weight:570}
.week-details .plan-chevron{font-size:22px;font-weight:450;color:#617173;flex-shrink:0}

/* Cardio follows existing monochrome style without a new bottom tab. */
.cardio-history{margin-top:12px;border-top:1px solid var(--line)}
.cardio-history-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cardio-history-row strong{display:block;font-size:15px;font-weight:750}
.cardio-history-row small{display:block;margin-top:3px;color:var(--secondary);font-size:12px}
.cardio-history-row>.muted{font-size:12px;text-align:right}

/* Cardio modal — same silver buttons and radii as the rest of FormIQ. */
.modal-panel .cardio-type-trigger{width:100%;min-height:54px;margin-top:4px;justify-content:space-between;text-align:left}
.cardio-choices{display:grid;grid-template-columns:1fr;gap:9px;margin:14px 0 8px}
.modal-panel .cardio-choice{margin-top:0;min-height:55px;justify-content:space-between;text-align:left;font-size:16px}
.cardio-chevron{font-size:22px;color:#657575}
/* Preview-only integration state buttons in Profile */
.preview-integrations{margin:9px 0 16px}
.preview-integrations .button-subtle{min-height:46px;font-size:13px}
/* Fixed-in-view settings access: keep the approved header in place while scrolling. */
.profile-open{position:fixed;top:calc(19px + env(safe-area-inset-top));right:max(20px,calc((100vw - 460px)/2 + 20px));z-index:75;background:rgba(238,243,241,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 4px 18px rgba(39,50,50,.12)}
@media(min-width:750px){.profile-open{top:calc(43px + env(safe-area-inset-top))}}
.history-scroll{overflow-y:auto;overscroll-behavior:contain;max-height:min(490px,65dvh);scrollbar-width:thin;margin:11px 0 14px;border-top:1px solid var(--line)}
.history-scroll .cardio-history-row{min-height:70px}
.history-modal .button-subtle{margin-top:8px}
/* Keep the cardio sheet's heading at the top of the visible screen while typing. */
.modal-wrap.cardio-entry:focus-within{align-items:flex-start}
.modal-wrap.cardio-entry:focus-within .modal-panel{border-radius:0 0 24px 24px;max-height:calc(100% - 4px);padding-top:calc(14px + env(safe-area-inset-top))}
.modal-wrap.cardio-entry.keyboard-open{align-items:flex-start}
.modal-wrap.cardio-entry.keyboard-open .modal-panel{border-radius:0 0 24px 24px;max-height:calc(100% - 4px);padding-top:calc(14px + env(safe-area-inset-top))}
.cardio-inline .cardio-type-trigger{width:100%;margin:0;justify-content:center;min-height:50px}
.cardio-inline-choices{margin:10px 0 4px;gap:7px}
.cardio-inline .cardio-choice{margin-top:0;min-height:46px;justify-content:flex-start}
.cardio-input-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cardio-input-grid .field{min-width:0}
.cardio-input-grid .field>span{min-height:34px}
.cardio-input-grid .field small{font-size:11px;font-weight:500}
.cardio-inline{scroll-margin-top:12px}
body.cardio-typing .bottom-nav{visibility:hidden}
.history-modal{display:flex;flex-direction:column;overflow:hidden;max-height:82dvh}
.history-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.history-top h2{margin:0}
.history-top .history-close{margin:0;min-width:82px;min-height:42px;padding:9px 12px;border-radius:12px;border:1px solid #b9c3c1;background:rgba(255,255,255,.55);font-size:13px;font-weight:750}
.history-modal .history-scroll{min-height:0;max-height:none;flex:1;margin-bottom:0}

.bottom-nav{grid-template-columns:repeat(3,minmax(0,1fr))}
.nav-item svg{width:23px;height:23px}

.fq-live-dialog.history-modal{padding-bottom:max(22px,env(safe-area-inset-bottom))}
.history-modal .history-top{display:flex;gap:10px;align-items:center;justify-content:space-between}
.history-modal .history-top h2{font-size:20px;margin:0;line-height:1.2}

/* Compact 2x2 weekly period grid follows the approved Aluminium v5 reference. */
.week-selector.fq-plan-period-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:5px 0 19px}
.fq-plan-period-grid>.week-group{display:contents}
.fq-plan-period-grid>.week-group:nth-child(1)>button{grid-area:1 / 1}
.fq-plan-period-grid>.week-group:nth-child(2)>button{grid-area:1 / 2}
.fq-plan-period-grid>.week-group:nth-child(3)>button{grid-area:2 / 1}
.fq-plan-period-grid>.week-group:nth-child(4)>button{grid-area:2 / 2}
.fq-plan-period-grid>.week-group>button{width:100%;height:63px;min-height:63px;padding:8px 7px;border:1px solid #c0c9c7!important;border-radius:13px!important;
 background:rgba(255,255,255,.34)!important;text-align:center;justify-content:center;box-shadow:none!important}
.fq-plan-period-grid>.week-group>button.on{background:linear-gradient(135deg,#d7dedc,#e8eeec)!important;
 border-color:#8c9b98!important;box-shadow:inset 0 2px 5px #55656026!important}
.fq-plan-period-grid .week-range{font-size:13px;line-height:1.27;letter-spacing:0;overflow-wrap:anywhere}
.fq-plan-period-grid .week-meta,.fq-plan-period-grid .week-chevron{display:none}
.fq-plan-period-grid .week-details{grid-area:3 / 1 / 4 / 3;padding:9px 0 0}
@media(max-width:375px){.fq-plan-period-grid .week-range{font-size:12px}}
/* Make actual cardio and strength input behavior match approved keyboard layout. */
body.cardio-typing .bottom-nav{visibility:hidden}
/* Do not change document height on focus: a mobile button tap must not shift. */
body.cardio-typing .cardio-inline{scroll-margin-top:calc(18px + max(env(safe-area-inset-top),var(--fq-content-safe-top,0px)))}


/* Mobile geometry: symmetric inline inputs, aligned labels, stable touch targets. */
.workout-entry .workout-input-grid{align-items:end}
.workout-entry .workout-input-grid .field{display:grid;grid-template-rows:minmax(35px,auto) 51px;align-content:end;gap:8px;min-width:0}
.workout-entry .workout-input-grid .field>span{min-height:35px;display:flex;align-items:flex-end;line-height:1.25;overflow-wrap:anywhere}
.workout-entry .workout-input-grid .field>input{box-sizing:border-box;height:51px;min-height:51px;max-height:51px;width:100%;margin:0;border-radius:12px;min-width:0}
.fq-onboard-choice .option-grid.fq-sex-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fq-sex-options>.choice{min-width:0;width:100%;min-height:58px;display:flex;align-items:center;justify-content:center;padding:7px 5px;text-align:center;font-size:13px;line-height:1.2;overflow-wrap:normal}
@media(max-width:375px){.fq-sex-options>.choice{font-size:12px;padding:6px 3px}}
/* Real primary and secondary workout controls stay above the fixed tab bar. */
.fq-live-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.fq-live-actions .button-subtle,.fq-live-actions .button-main{min-width:0;width:100%;min-height:51px;white-space:normal;text-align:center;line-height:1.25;padding:10px 8px}
.workout-entry .workout-cta .button-main{width:100%;min-height:51px;line-height:1.25;text-align:center}
.rest-panel .button-subtle{min-height:51px}
.view .fq-live-actions:last-child{margin-bottom:16px}
.fq-live-dialog{max-width:min(460px,100%);overscroll-behavior:contain}
@media(max-width:375px){.fq-live-actions{gap:7px}.fq-live-actions .button-subtle{font-size:13px}}

/* Three actual training-place choices, equal-size and balanced like the sex controls. */
.fq-onboard-choice .option-grid.fq-equipment-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fq-equipment-options>.choice{width:100%;min-width:0;min-height:69px;padding:9px 5px;
 display:flex;align-items:center;justify-content:center;line-height:1.24;text-align:center;
 overflow-wrap:break-word;font-size:12px}
@media(max-width:375px){.fq-equipment-options>.choice{padding:7px 3px;font-size:11.5px}}

/* 44px hit targets for history month controls and bottom-sheet close. */
.history-cal-inline .calendar-controls>button{width:44px;min-width:44px;min-height:44px;height:44px}
.history-cal-inline .history-cal-grid button{min-height:44px}
.history-modal .history-close{min-height:44px}
.fq-live-dialog .fq-live-topline .button-subtle{min-height:44px}
/* On compact 360×740 phones, keep optional set actions above the fixed tabs
   at initial scroll, without reducing input height or changing other screens. */

}

/* FORMIQ onboarding v6: two sex choices, inline field errors, rose theme. */
.fq-sex-options{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px}
.fq-sex-options .choice{min-height:54px;font-weight:760}
.fq-form-error{font-size:13px;line-height:1.4;color:#a73548;margin:7px 0 8px;font-weight:680}
.fq-onboard-choice .fq-form-error{margin-top:8px}
.fq-onboard-actions{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.fq-onboard-actions .button-main{min-height:56px}
.field select{width:100%;min-height:50px;border:1px solid #b9c6c3;border-radius:12px;padding:11px 12px;background:#fdfefe;color:var(--ink)}

/* Female profile: observed days only on the monthly grid; forecast stays separate. */
.fq-cycle-navigation{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:13px 0}
.fq-cycle-navigation strong{font-size:16px;text-transform:capitalize;text-align:center}
.fq-cycle-navigation button{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:#fff9;font-size:28px;line-height:1}
.fq-cycle-month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;align-items:center;width:100%}
.fq-cycle-weekday{font-size:11px;font-weight:740;color:var(--secondary);text-align:center;padding:7px 0}
.fq-cycle-day,.fq-cycle-empty{min-width:0;aspect-ratio:1 / 1;display:flex;align-items:center;justify-content:center;border-radius:11px;position:relative}
.fq-cycle-day{background:rgba(255,255,255,.5);border:1px solid rgba(160,150,155,.12);font-size:13px;font-weight:650}
.fq-cycle-day.today{box-shadow:inset 0 0 0 1.5px var(--orange)}
.fq-cycle-day.recorded{background:#e5a9c5;border-color:#c784a7;color:#4a263c;font-weight:800}
.fq-cycle-day.recorded.today{box-shadow:inset 0 0 0 2px #7c4467}
.fq-cycle-legend{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--secondary);margin:12px 0 17px}
.fq-cycle-swatch{display:inline-block;width:13px;height:13px;border-radius:4px;background:#e5a9c5;border:1px solid #c784a7}
.fq-cycle-forecast{margin:15px 0;padding:10px 12px;background:rgba(230,217,225,.38);border:1px dashed #b68daa;border-radius:12px;font-size:13px}
.fq-cycle-forecast strong{display:block;margin:3px 0;font-size:17px}
.fq-cycle-forecast small{display:block;color:var(--secondary);font-size:12px;line-height:1.4}
.fq-cycle-history{max-height:290px;overflow-y:auto;overscroll-behavior:contain}
.fq-cycle-actions,.fq-cycle-confirm{display:flex;align-items:center;gap:6px;flex-shrink:0}
.fq-cycle .fq-period-row button{min-height:38px;padding:7px 9px;font-size:12px}
.fq-cycle-confirm button:first-child{border-color:#ac4e73;color:#922b54}
.fq-cycle .fq-period-row>span:first-child{min-width:0;overflow-wrap:anywhere}
.fq-cycle .fq-period-row small{display:block;font-size:11px;color:var(--secondary);margin-top:3px}
@media(max-width:360px){
 .fq-cycle-month{gap:2px}
 .fq-cycle-day{font-size:12px;border-radius:8px}
 .fq-cycle .fq-period-row{align-items:flex-start;flex-direction:column}
 .fq-cycle-actions,.fq-cycle-confirm{width:100%}
}
.fq-period-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.fq-period-row span{font-size:14px;line-height:1.5}
.fq-period-row button{min-height:40px;border:1px solid var(--line);border-radius:10px;background:#fff9;padding:8px 10px}

 background:

:root,body.theme-female{--pistachio:#91a98c}

button:active{filter:brightness(.96)}
.date-filter-summary{display:flex;align-items:center;gap:9px;justify-content:space-between;flex-wrap:wrap}
.date-filter-summary .button-subtle{width:auto;min-width:115px;height:46px;min-height:46px;padding:9px 14px;flex:none}

.fq-weight-preview{max-height:230px;overflow:auto;margin:14px 0}
/* Four-week plan and compact exercise preview share Aluminium tokens. */

.fq-plan-preview:focus-visible,.fq-preview-exercise:focus-visible{outline:3px solid var(--pistachio);outline-offset:2px}

.fq-preview-exercise span:nth-child(2){flex:1;min-width:0}

.fq-exercise-photo{margin:14px 0 18px}.fq-exercise-photo img{display:block;width:100%;max-height:310px;object-fit:contain;background:var(--ivory);border:1px solid var(--line);border-radius:16px}.fq-exercise-photo figcaption{font-size:12px;line-height:1.55;color:var(--secondary);margin-top:8px}.fq-exercise-photo a{color:var(--ink);text-underline-offset:2px}

.fq-live-dialog:has(.fq-catalog-candidate){max-height:85dvh;overflow-y:auto}

/* TZ3: Telegram overlay safe areas, keyboard viewport and balanced history controls. */
.profile-open{top:calc(19px + max(env(safe-area-inset-top),var(--fq-content-safe-top,0px)))}
.fq-live-overlay{
 padding-top:calc(16px + max(env(safe-area-inset-top),var(--fq-content-safe-top,0px)));
 padding-bottom:calc(14px + max(env(safe-area-inset-bottom),var(--fq-content-safe-bottom,0px)));
