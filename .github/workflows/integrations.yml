name: Integrations (offline)
on:
  push:
    branches:
      - feature/health-integrations-38.1.0
      - release/formiq-38.1.2
      - release/formiq-38.1.3
      - main
      - release/formiq-v5-integration-20261023
      - release/formiq-38.2.0
      - release/formiq-38.1.4-clean-welcome
  workflow_dispatch:
jobs:
  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile integration modules
        run: python -m py_compile integrations/fatsecret.py integrations/garmin.py tests/test_integrations.py
      - name: Check UX JavaScript
        run: node --check web/ux-381.js && node --check web/ux-3811.js && node --check web/ux-382.js && node --check web/v5-live.js
      - name: Install runtime and CSS validator
        run: pip install -r requirements.txt tinycss2
      - name: Compile bot
        run: python -m py_compile main.py welcome_art.py
      - name: Run full static smoke and UX tests
        run: |
          python tests/test_static.py
          python -m unittest discover -s tests -p test_ux_381.py -v
          python -m unittest discover -s tests -p test_routes_381.py -v
          python -m unittest discover -s tests -p test_telegram_3813.py -v
          python -m unittest discover -s tests -p test_382.py -v
          python -m unittest discover -s tests -p test_v5_bridge.py -v
      - name: Run integration tests
        run: python -m unittest discover -s tests -p test_integrations.py -v
