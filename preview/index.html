    const order=['legs','back','chest','shoulders','arms'];
    const names={legs:'Ноги',back:'Спина',chest:'Грудь',shoulders:'плечи',arms:'руки'};

    const delta=Math.round((dateObj(workoutDate)-dateObj(key))/86400000);

}
function progress(){const strength=chartExercise==='legs'?[60,65,70,75]:[35,40,40,45];return `${header()}<span class="kicker">История и результаты</span><h1 class="title">Прогресс</h1><p class="intro">Каждая величина подписана. Ниже — демонстрационные данные, а не твои результаты.</p><section class="surface"><div class="chart-caption"><strong>Рабочий вес</strong><small>килограммы · 4 недели</small></div><div class="segmented"><button class="${chartExercise==='legs'?'on':''}" data-chart="legs">Жим ногами</button><button class="${chartExercise==='pull'?'on':''}" data-chart="pull">Тяга блока</button></div><div class="chart-block">${graph(strength,'кг','Рабочий вес')}</div><p class="chart-leg">Н1–Н4 — недели программы. Значения на вертикальной оси — вес в килограммах.</p></section><section class="surface"><div class="chart-caption"><strong>Масса тела</strong><small>килограммы · 4 недели</small></div><div class="chart-block">${graph([82,81.5,81,80.5],'кг','Масса тела',1)}</div><p class="chart-leg">Пример отображения динамики веса. Реальные данные появятся после подключения дневника.</p></section>${progressActiveCalories()}<section class="surface"><div class="heading-row"><h2 style="margin:0;font-size:20px">История тренировок</h2><span class="badge">По датам</span></div><p class="input-note" style="margin-top:12px">Силовые тренировки и самостоятельное кардио — в общей истории по датам. В предпросмотре ниже показаны записи, сохранённые в этом браузере.</p>${!demoHistoryItems().length?'<p class="input-note" style="margin-top:8px">Пример истории · демонстрационные занятия, не твои записи.</p>':''}<div class="cardio-history">${historyRows(historyForPreview().slice(0,3))}</div><button type="button" class="button-subtle" data-act="history-open" style="margin-top:13px">Вся история →</button></section><section class="summary-grid"><div class="metric"><span>Тренировок за месяц</span><strong>10</strong><span>Пример</span></div><div class="metric"><span>Без пропусков</span><strong>3 нед.</strong><span>Пример</span></div></section>`}
function food(){return `${header()}<span class="kicker">Рацион</span><h1 class="title">Питание</h1><p class="intro">Понятный дневник питания, без лишней информации.</p>${previewIntegrations.fatsecret?`<section class="surface"><span class="eyebrow">СЕГОДНЯ · FATSECRET · ДЕМО ВИДА</span><div class="nutrition-today" style="margin-top:15px"><div class="nutrition-ring"><b>—</b><span>ккал</span></div><div><h3>Из — ккал</h3><p>Съеденные калории из рекомендованной нормы. Нет данных синхронизации, поэтому значения не показаны.</p></div></div></section><section class="surface"><div class="heading-row"><h2 style="margin:0;font-size:20px">FatSecret</h2><span class="badge">Демо</span></div><div class="metric" style="margin-top:14px"><span>ккал / белки / жиры / углеводы</span><strong style="font-size:23px">— / — / — / —</strong><span>Нет синхронизированных данных</span></div><p class="input-note" style="margin-top:12px">Это вид после подключения. FatSecret не подключён. Включено только для проверки дизайна.</p></section>`:`<section class="surface"><span class="eyebrow">СЕГОДНЯ · ПРИМЕР</span><div class="nutrition-today" style="margin-top:15px"><div class="nutrition-ring"><b>1 640</b><span>ккал</span></div><div><h3>Из 2 200 ккал</h3><p>Данные демонстрационные. После подключения дневника они будут персональными.</p></div></div></section><section class="surface"><h2 style="font-size:21px;margin:0 0 18px">Белки, жиры, углеводы</h2>${[['Белки','112 / 150 г'],['Жиры','54 / 75 г'],['Углеводы','174 / 230 г']].map(([l,n])=>`<div class="macro"><strong>${l}</strong><span>${n}</span></div>`).join('')}</section><section class="surface soft"><h2 style="font-size:20px;margin:0 0 10px">Приёмы пищи</h2><p class="muted" style="margin:0 0 14px">Завтрак · Обед · Ужин · Перекусы</p><button class="button-subtle" data-act="food-add">Добавить приём пищи</button></section>`}`}
function choiceGroup(values,sel,attr){return `<div class="option-grid">${values.map(([val,txt])=>`<button class="choice ${sel===val?'on':''} ${attr==='goal'?'goal':''}" data-pick="${attr}" data-val="${esc(val)}" aria-pressed="${sel===val}">${esc(txt)}</button>`).join('')}</div>`}
function equipmentPanel(){

}
function profileView(){return `${header(true)}<span class="kicker">Настройки</span><h1 class="title">Твой профиль</h1><p class="intro">Одна анкета, которую можно изменить в любой момент. При первом заполнении все личные поля пустые.</p><section class="surface"><h2 class="section-label" style="margin-top:0">Основные параметры</h2><p class="input-note">Пол</p>${choiceGroup([['m','Мужской'],['f','Женский']],profile.sex,'sex')}<div class="form-row"><label class="field">Возраст<input id="age" inputmode="numeric" type="number" min="14" max="100" placeholder="лет" value="${esc(profile.age)}"></label><label class="field">Рост<input id="height" inputmode="decimal" type="number" min="100" max="250" placeholder="см" value="${esc(profile.height)}"></label><label class="field">Вес<input id="weight" inputmode="decimal" type="number" min="20" max="350" step="0.1" placeholder="кг" value="${esc(profile.weight)}"></label></div><h2 class="section-label">Цель тренировок</h2>${choiceGroup(goals.map(v=>[v,v]),profile.goal,'goal')}<h2 class="section-label">Где тренируешься</h2>${choiceGroup([['gym','Тренажёрный зал'],['home','Дома']],profile.place,'place')}${equipmentPanel()}<h2 class="section-label">Дни тренировок</h2><div class="weekdays">${dayLabels.map((d,i)=>`<button class="weekday ${profile.days.includes(i)?'on':''}" data-day="${i}" aria-pressed="${profile.days.includes(i)}">${d}</button>`).join('')}</div><h2 class="section-label">Длительность занятия</h2><div class="range-row"><span>Время тренировки</span><strong id="duration-label">${profile.duration} мин</strong></div><input class="range" type="range" id="duration" min="20" max="90" step="5" value="${profile.duration}" aria-label="Длительность тренировки"><div class="range-labels"><span>20 мин</span><span>90 мин</span></div></section><section class="surface"><h2 class="section-label" style="margin-top:0">Самочувствие и ограничения</h2><p class="input-note" style="margin-bottom:12px">Опиши своими словами, что беспокоит. Никаких лишних вариантов и диагнозов.</p><label class="field"><span>Твой текст</span><textarea id="limits" placeholder="Например: беспокоит колено при приседаниях…">${esc(profile.limits)}</textarea></label><label class="checkbox-line"><input type="checkbox" id="consent" ${profile.consent?'checked':''}><span>Согласен на обработку моего описания с помощью ИИ для подготовки параметров тренировок.</span></label><button class="button-subtle" style="margin-top:17px" data-act="ai-preview">Посмотреть результат обработки</button><p class="input-note" style="margin-top:12px">В реальном приложении сюда придёт структурированный результат от ИИ. Здесь показывается твой текст без анализа и передачи на сервер.</p>${aiResultOpen?`<div class="note health-review" role="status"><strong>Проверка перед сохранением · демо</strong><p style="white-space:pre-wrap;margin:9px 0">${esc(profile.limits)}</p><p class="input-note">Это исходное описание, а не заключение ИИ. Ты подтверждаешь текст перед сохранением.</p><button class="button-subtle" data-act="confirm-limits" style="margin-top:10px">Подтвердить описание</button></div>`:''}${profile.confirmedLimits?`<div class="note health-confirmation"><strong>Описание подтверждено</strong><p style="white-space:pre-wrap;margin:9px 0 0">${esc(profile.confirmedLimits)}</p></div>`:''}</section><section class="surface soft"><h2 class="section-label" style="margin-top:0">Подключения</h2><p class="input-note">Сервисы подключаются здесь один раз, а данные отображаются в своих разделах.</p><div class="connection-row"><div><div class="connection-title">FatSecret</div><div class="connection-hint">Дневник питания → «Питание»</div></div><span class="connection-status">Не подключено</span></div><div class="preview-integrations"><button type="button" class="button-subtle" data-act="preview-fatsecret-toggle" aria-pressed="${previewIntegrations.fatsecret}">${previewIntegrations.fatsecret?'Обычный вид «Питания»':'Посмотреть вид с FatSecret · демо'}</button></div><div class="connection-row"><div><div class="connection-title">Garmin Connect</div><div class="connection-hint">Активность и восстановление → «Прогресс»</div></div><span class="connection-status">Не подключено</span></div><div class="preview-integrations"><button type="button" class="button-subtle" data-act="preview-garmin-toggle" aria-pressed="${previewIntegrations.garmin}">${previewIntegrations.garmin?'Обычный вид «Прогресса»':'Посмотреть вид с Garmin · демо'}</button></div><p class="input-note" style="margin-top:14px">Кнопки выше переключают только внешний вид предпросмотра. Аккаунты не подключаются, данные не передаются. Реальные подключения появятся после настройки авторизации.</p></section><button class="button-main" data-act="save-profile">Сохранить анкету</button><p class="input-note" style="text-align:center;margin-top:11px">В прототипе данные сохраняются только в этом браузере. Сервер и бот не изменяются.</p>`}
function toast(message){document.querySelector('.toast')?.remove();const p=document.createElement('div');p.className='toast';p.setAttribute('role','status');p.textContent=message;document.body.appendChild(p);clearTimeout(toastTimer);toastTimer=setTimeout(()=>p.remove(),4300)}
function draw(){const special=['profile','day'].includes(screen);app.innerHTML=`<main class="view ${special?'no-bottom':''}">${({home,plan,progress,food,profile:profileView,day:dayView})[screen]()}</main>${foot()}${modalHtml()}`;}
function modalHtml(){
 if(!modal)return '';
 if(modal==='history')return `<div class="modal-wrap" data-close="outside"><div class="modal-panel history-modal" role="dialog" aria-modal="true" aria-label="История тренировок"><h2>История тренировок</h2><p>${demoHistoryItems().length?'Сохранённые занятия · '+demoHistoryItems().length:'Пример истории · 10 демонстрационных занятий (не твои записи)'}. Прокручивай список, чтобы увидеть все занятия.</p><div class="history-scroll" role="region" aria-label="Прокручиваемая история тренировок" tabindex="0"><div class="cardio-history">${historyRows(historyForPreview())}</div></div><button type="button" class="button-subtle" data-act="history-close">Закрыть</button></div></div>`;
 if(modal==='cardio-type')return `<div class="modal-wrap" data-close="outside"><div class="modal-panel" role="dialog" aria-modal="true" aria-label="Выбрать вид кардио"><h2>Вид кардио</h2><div class="cardio-choices">${['Ходьба','Бег','Велосипед','Плавание','Другое'].map(type=>`<button type="button" class="button-subtle cardio-choice" data-act="cardio-type-select" data-type="${type}"><span>${type}</span><span class="cardio-chevron" aria-hidden="true">›</span></button>`).join('')}</div><button class="button-subtle" data-act="cardio-type-back">Назад</button></div></div>`;
 if(modal==='cardio-other')return `<div class="modal-wrap" data-close="outside"><div class="modal-panel" role="dialog" aria-modal="true" aria-label="Другой вид кардио"><h2>Другой вид кардио</h2><label class="field">Какое кардио ты сделал?<input id="cardio-other-name" type="text" maxlength="60" placeholder="Например: гребля" value="${esc(cardioDraft.other)}"></label><button class="button-main" data-act="cardio-other-apply">Продолжить</button><button class="button-subtle" data-act="cardio-other-back">Назад к выбору</button></div></div>`;
 if(modal==='cardio')return `<div class="modal-wrap" data-close="outside"><div class="modal-panel" role="dialog" aria-modal="true" aria-label="Записать кардио"><h2>Записать кардио</h2><p>Запиши кардио, которое сделал самостоятельно.</p><label class="field"><span>Вид кардио</span><button class="button-subtle cardio-type-trigger" type="button" data-act="cardio-type-open" aria-haspopup="dialog"><span>${esc(cardioDraft.type==='Другое'?cardioDraft.other:cardioDraft.type)||'Выбрать вид кардио'}</span><span class="cardio-chevron" aria-hidden="true">⌄</span></button></label><label class="field" style="margin-top:15px">Время, минут<input id="cardio-minutes" type="number" inputmode="numeric" min="1" placeholder="Например, 25" value="${esc(cardioDraft.minutes)}"></label><label class="field" style="margin-top:15px">Средний пульс, уд/мин · необязательно<input id="cardio-hr" type="number" inputmode="numeric" min="40" max="220" placeholder="Если измерял" value="${esc(cardioDraft.hr)}"></label><button class="button-main" data-act="cardio-save">Сохранить кардио</button><button class="button-subtle" data-act="modal-close">Отмена</button><p class="input-note">Калории оцениваются по виду кардио, времени и весу из анкеты; пульс сохраняется отдельно. Garmin Connect пока не подключён: после настройки официальной синхронизации приложение сможет сверять данные занятия с Garmin. Демо: в настоящий FORMIQ данные не отправляются.</p></div></div>`;
 if(modal==='strength-finish')return `<div class="modal-wrap" data-close="outside"><div class="modal-panel" role="dialog" aria-modal="true" aria-label="Завершить силовую тренировку"><h2>Тренировка завершена</h2><p>Укажи фактическое время занятия. Средний пульс можно оставить пустым, если его не измерял.</p><label class="field">Время тренировки, минут<input id="strength-minutes" type="number" inputmode="numeric" min="1" placeholder="Фактическое время"></label><label class="field" style="margin-top:15px">Средний пульс, уд/мин · необязательно<input id="strength-hr" type="number" inputmode="numeric" min="40" max="220" placeholder="Если измерял"></label><p class="input-note" style="margin-top:12px">Garmin Connect пока не подключён. При появлении официальной синхронизации данные занятия будем искать по времени и типу активности. Расход ккал здесь ориентировочный.</p><button class="button-main" data-act="strength-save">Сохранить результат</button><button class="button-subtle" data-act="strength-finish-cancel">Продолжить тренировку</button></div></div>`;
  if(modal==='feedback')return `<div class="modal-wrap" data-close="outside"><div class="modal-panel" role="dialog" aria-modal="true" aria-label="Отзывы и предложения"><h2>Отзывы и предложения</h2><p>Напиши, что улучшить. В этом дизайн-прототипе сообщения не отправляются и никому не приходят.</p><textarea id="feedback-msg" placeholder="Твоя идея или замечание…"></textarea><button class="button-main" data-act="feedback-confirm">Проверить отзыв (без отправки)</button><button class="button-subtle" data-act="modal-close">Закрыть</button></div></div>`;return ''}
function setScreen(next){if(next==='profile'){previous=screen==='day'?'plan':screen}else if(next==='day'){previous='plan'}screen=next;modal='';draw();window.scrollTo({top:0,behavior:'instant'});}
function saveInlineFields(){for(let key of ['age','height','weight','limits','homeEquipment']){const el=document.getElementById(key);if(el)profile[key]=el.value}const c=document.getElementById('consent');if(c)profile.consent=c.checked;const range=document.getElementById('duration');if(range)profile.duration=Number(range.value)}
app.addEventListener('input',e=>{const t=e.target;if(['age','height','weight','limits','homeEquipment'].includes(t.id)){if(t.id==='limits'&&profile.limits!==t.value){profile.confirmedLimits='';aiResultOpen=false;document.querySelector('.health-review')?.remove();document.querySelector('.health-confirmation')?.remove();}profile[t.id]=t.value}if(t.id==='duration'){profile.duration=Number(t.value);document.getElementById('duration-label').textContent=`${profile.duration} мин`}});
app.addEventListener('change',e=>{if(e.target.id==='consent'){profile.consent=e.target.checked;if(!profile.consent){profile.confirmedLimits='';aiResultOpen=false;}}});
app.addEventListener('click',e=>{
const nav=e.target.closest('[data-nav]');if(nav){saveInlineFields();setScreen(nav.dataset.nav);return;}
const choose=e.target.closest('[data-pick]');if(choose){saveInlineFields();profile[choose.dataset.pick]=choose.dataset.val;draw();return;}
const wd=e.target.closest('[data-day]');if(wd){saveInlineFields();const n=Number(wd.dataset.day);profile.days=profile.days.includes(n)?profile.days.filter(x=>x!==n):[...profile.days,n].sort((a,b)=>a-b);draw();return;}
const wk=e.target.closest('[data-week]');if(wk){const selected=Number(wk.dataset.week);planWeek=planWeek===selected?0:selected;draw();return;}
const chart=e.target.closest('[data-chart]');if(chart){chartExercise=chart.dataset.chart;draw();return;}
const date=e.target.closest('[data-date]');if(date){selectedDate=date.dataset.date;setScreen('day');return;}
const act=e.target.closest('[data-act]');if(!act){if(e.target.classList?.contains('modal-wrap')){modal='';draw()}return;}
switch(act.dataset.act){
case 'profile':setScreen('profile');break;
case 'history-open':modal='history';draw();break;
case 'history-close':modal='';draw();break;
case 'preview-fatsecret-toggle':
case 'preview-garmin-toggle':{
  const key=act.dataset.act==='preview-fatsecret-toggle'?'fatsecret':'garmin';
  const updated={...previewIntegrations,[key]:!previewIntegrations[key]};
  try{localStorage.setItem('formiq_preview_integration_views_v1',JSON.stringify(updated));}
  catch(_err){toast('Не удалось сохранить выбор вида в браузере.');break;}
  previewIntegrations=updated;draw();break;
}
case 'back':setScreen(previous==='profile'?'home':previous);break;
case 'return-home':setScreen('home');break;
case 'open-today':selectedDate=nextTraining();setScreen('day');break;
case 'demo-start':{
  if(selectedDate!==demoToday||!isWorkout(selectedDate)||completedStrength(selectedDate)){
    toast('Начать можно только сегодняшнюю незавершённую тренировку.');break;
  }
  demoWorkoutActiveDate=selectedDate;draw();
  toast('Демо: тренировка начата. Отметки подходов здесь не записываются.');break;
}
case 'demo-finish':{
  if(demoWorkoutActiveDate!==selectedDate||completedStrength(selectedDate)){toast('Нет активной тренировки.');break;}
  modal='strength-finish';draw();break;
}
case 'strength-finish-cancel':modal='';draw();break;
case 'strength-save':{
  if(demoWorkoutActiveDate!==selectedDate||selectedDate!==demoToday||completedStrength(selectedDate)){
    toast('Не удалось подтвердить завершение тренировки.');break;
  }
  const minText=document.getElementById('strength-minutes')?.value.trim()||'';
  const hrText=document.getElementById('strength-hr')?.value.trim()||'';
  const minutes=Number(minText),avgHr=hrText?Number(hrText):null;
  if(!/^[0-9]+$/.test(minText)||!Number.isSafeInteger(minutes)||minutes<=0){toast('Укажи фактическое время в минутах.');break;}
  if(hrText&&(!/^[0-9]+$/.test(hrText)||!Number.isInteger(avgHr)||avgHr<40||avgHr>220)){toast('Средний пульс: 40–220 уд/мин либо пустое поле.');break;}
  const item={isoDate:selectedDate,date:dateObj(selectedDate).toLocaleDateString('ru-RU'),
    title:sessionName(selectedDate),minutes,avgHr,estimatedKcal:approximateKcal(minutes,3.5),
    weightKgAtRecord:demoWeightKg()};
  const updated=[item,...strengthEntries];
  try{localStorage.setItem('formiq_preview_strength_v1',JSON.stringify(updated));}
  catch(_error){toast('Не удалось сохранить в браузере.');break;}
  strengthEntries=updated;demoWorkoutActiveDate='';modal='';setScreen('home');
  toast('Результат силовой записан в историю предпросмотра.');break;
}
case 'food-add':toast('Добавление еды появится после подключения дневника.');break;
case 'cardio-add':cardioDraft={type:'',other:'',minutes:'',hr:''};modal='cardio';draw();break;
case 'cardio-type-open':
  cardioDraft.minutes=document.getElementById('cardio-minutes')?.value||'';
  cardioDraft.hr=document.getElementById('cardio-hr')?.value||'';
  modal='cardio-type';draw();break;
case 'cardio-type-back':modal='cardio';draw();break;
case 'cardio-other-back':
  cardioDraft.other=document.getElementById('cardio-other-name')?.value||cardioDraft.other;
  modal='cardio-type';draw();break;
case 'cardio-type-select':{
  const type=act.dataset.type;
  if(type==='Другое'){cardioDraft.type='Другое';modal='cardio-other';draw();}
  else if(['Ходьба','Бег','Велосипед','Плавание'].includes(type)){cardioDraft.type=type;modal='cardio';draw();}
  break;
}
case 'cardio-other-apply':{
  const typed=(document.getElementById('cardio-other-name')?.value||'').trim().replace(/\s+/g,' ');
  if(!typed||typed.length>60){toast('Напиши вид кардио, до 60 символов.');break;}
  cardioDraft.type='Другое';cardioDraft.other=typed;modal='cardio';draw();break;
}
case 'cardio-save':{
  const type=cardioDraft.type==='Другое'?cardioDraft.other:cardioDraft.type;
  const minsText=document.getElementById('cardio-minutes')?.value.trim()||'';
  const hrText=document.getElementById('cardio-hr')?.value.trim()||'';
  const minutes=Number(minsText),avgHr=hrText?Number(hrText):null;
  if(!type||type.length>60){toast('Выбери вид кардио.');break;}
  if(!/^\d+$/.test(minsText)||!Number.isSafeInteger(minutes)||minutes<1){toast('Время должно быть положительным целым числом минут.');break;}
  if(hrText&&(!/^\d+$/.test(hrText)||avgHr<40||avgHr>220)){toast('Пульс: от 40 до 220 уд/мин или оставь поле пустым.');break;}
  const now=new Date();
  const entry={date:now.toLocaleDateString('ru-RU'),isoDate:iso(now),minutes,avgHr,type,estimatedKcal:approximateKcal(minutes,cardioMet(type)),weightKgAtRecord:demoWeightKg()};
  const updated=[entry,...cardioEntries];
  try{localStorage.setItem('formiq_preview_cardio_v1',JSON.stringify(updated));}
  catch(_error){toast('Не удалось сохранить в браузере.');break;}
  cardioEntries=updated;cardioDraft={type:'',other:'',minutes:'',hr:''};modal='';draw();
  toast('Кардио сохранено в предпросмотре.');break;
}
case 'save-profile':{saveInlineFields();try{localStorage.setItem('formiq_design_profile_v3',JSON.stringify(profile))}catch(e){toast('Браузер запретил локальное сохранение.')}toast('Анкета сохранена локально в этом браузере. Это не данные бота.');setTimeout(()=>setScreen('home'),600);break;}
case 'ai-preview':saveInlineFields();if(!profile.limits.trim()){toast('Сначала опиши, что беспокоит.');break;}if(!profile.consent){toast('Для анализа нужно отдельное согласие.');break;}aiResultOpen=true;draw();break;
case 'confirm-limits':profile.confirmedLimits=profile.limits;aiResultOpen=false;draw();toast('Описание подтверждено. Демонстрация: ИИ не запускался.');break;
case 'feedback':modal='feedback';draw();break;
case 'feedback-confirm':{const v=document.getElementById('feedback-msg')?.value.trim();toast(v?'В прототипе отзыв не отправлен. Для реальной отправки нужно подключить сервер.':'Напиши текст отзыва. Отправка в прототипе отключена.');break;}
case 'modal-close':modal='';draw();break;
}}
);
draw();
})();
</script>
</body></html>
